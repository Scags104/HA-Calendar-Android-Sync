# Opens pull requests when OkHttp, the Android Gradle plugin, Kotlin,
# or the GitHub Actions used in CI publish updates (including security fixes).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Build tooling: major upgrades need a manual migration, so do them deliberately.
      # (These plugins aren't shipped in the APK; OkHttp still gets every update.)
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
