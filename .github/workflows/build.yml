name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]   # v2026.10.3 or 2026.10.3
  pull_request:
  workflow_dispatch:

# Least privilege: the build job can only read the repo.
# Only the release job (tags only) gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # don't leave the GitHub token on disk for later steps

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK; this provides Gradle itself.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      # Pull requests are never signed with the release key.
      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != '' && github.event_name != 'pull_request'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="ha-calendar-sync-${GITHUB_REF_NAME#v}"
          else
            NAME="ha-calendar-sync-build${GITHUB_RUN_NUMBER}"
          fi
          mv app/build/outputs/apk/release/*.apk "$NAME.apk"
          sha256sum ha-calendar-sync-*.apk > SHA256SUMS.txt

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: ha-calendar-sync-apk
          path: |
            ha-calendar-sync-*.apk
            SHA256SUMS.txt

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ha-calendar-sync-apk

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ha-calendar-sync-*.apk
            SHA256SUMS.txt
